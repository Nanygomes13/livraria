<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Biblioteca Virtual</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="pagina">
        <h2 class="titulo-pagina">Login</h2>
        <form id="form-login" class="formulario">
          <label for="login-email">E-mail:</label>
          <input type="email" id="login-email" name="login-email" required />

          <label for="login-senha">Senha:</label>
          <input type="password" id="login-senha" name="login-senha" required />

          <button type="submit">Entrar</button>
          <p style="text-align: center; margin-top: 15px">
            Não tem uma conta? <a href="cadastro.html">Faça o cadastro aqui</a>
          </p>
        </form>
      </div>
    </main>

    <script>
      document
        .getElementById("form-login")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("login-email").value.trim();
          const senha = document.getElementById("login-senha").value;

          if (!email || !senha) {
            alert("Preencha todos os campos.");
            return;
          }

          if (senha.length < 6) {
            alert("Senha muito curta.");
            return;
          }

          localStorage.setItem("logado", "true");
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
