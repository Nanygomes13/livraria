<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Biblioteca Virtual</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="pagina">
        <h2 class="titulo-pagina">Cadastro de Usuário</h2>
        <form id="form-cadastro" class="formulario">
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required />

          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" required />

          <label for="confirmar">Confirmar senha:</label>
          <input type="password" id="confirmar" name="confirmar" required />

          <button type="submit">Cadastrar</button>
          <p style="text-align: center; margin-top: 15px">
            Já tem uma conta? <a href="login.html">Faça login aqui</a>
          </p>
        </form>
      </div>
    </main>

    <script>
      document.getElementById("form-cadastro").addEventListener("submit", function (e) {e.preventDefault();

          const nome = document.getElementById("nome").value.trim();
          const email = document.getElementById("email").value.trim();
          const senha = document.getElementById("senha").value;
          const confirmar = document.getElementById("confirmar").value;

          if (!nome || !email || !senha || !confirmar) {
            alert("Preencha todos os campos.");
            return;
          }

          if (senha.length < 6) {
            alert("A senha deve ter pelo menos 6 caracteres.");
            return;
          }

          if (senha !== confirmar) {
            alert("As senhas não coincidem.");
            return;
          }

          window.location.href = "login.html";
        });
    </script>
  </body>
</html>
