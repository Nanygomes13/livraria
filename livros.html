<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca Virtual</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body onload="atualizarHora()">
    <header>
      <h1>Biblioteca Particular</h1>
      <nav>
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="livros.html" class="active">Livros</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
      <button onclick="logout()" class="btn-logout">Sair</button>
    </header>

    <section>
      <section class="controle-livros">
        <div class="busca-container">
          <input
            type="text"
            id="busca"
            placeholder="Buscar livro..."
            oninput="filtrarLivros()"
          />
          <i class="fas fa-search"></i>
        </div>
        <p id="dataHora">Última atualização:</p>
      </section>

      <div class="livros-lista">
        <article class="livro">
          <img src="images/Divergente.jpg" alt="Divergente" />
          <h3>Divergente</h3>
          <p><em>Veronica Roth</em></p>
          <a href="divergente.html" class="btn-livro">Ver mais</a>
        </article>

        <article class="livro">
          <img src="images/capaInsurgente.jpg" alt="Insurgente" />
          <h3>Insurgente</h3>
          <p><em>Veronica Roth</em></p>
          <a href="livro.html" class="btn-livro">Ver mais</a>
        </article>

        <article class="livro">
          <img src="images/capaConvergente.jpg" alt="Convergente" />
          <h3>Convergente</h3>
          <p><em>Veronica Roth</em></p>
          <a href="livro.html" class="btn-livro">Ver mais</a>
        </article>

        <article class="livro">
          <img src="images/tetoParaDois.jpg" alt="Teto para Dois" />
          <h3>Teto para dois</h3>
          <p><em>Beth O'leary</em></p>
          <a href="livro.html" class="btn-livro">Ver mais</a>
        </article>

        <article class="livro">
          <img
            src="images/harrypotter1.jpg"
            alt="Harry Potter e a Pedra Filosofal"
          />
          <h3>Harry Potter e a Pedra Filosofal</h3>
          <p><em>J.K. Rowling</em></p>
          <a href="livro.html" class="btn-livro">Ver mais</a>
        </article>
      </div>
    </section>

    <script src="cod.js"></script>
  </body>
</html>
